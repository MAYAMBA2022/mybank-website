<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBank Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 24px;
    }

    .logout {
      width: auto;
      padding: 10px 18px;
      background: white;
      color: #2563eb;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .card h4 {
      color: #64748b;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 22px;
      font-weight: bold;
      word-break: break-word;
    }

    .transactions {
      margin-top: 30px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    .credit {
      color: green;
      font-weight: bold;
    }

    .debit {
      color: red;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 30px;
      color: red;
      font-weight: bold;
    }

    .transfer-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>MyBank</h2>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="container">

    <div class="welcome">
      <h2>
        Welcome, <span id="customerName">Customer</span> 👋
      </h2>
      <p>MyBank Account Dashboard</p>
    </div>

    <div class="cards">

      <div class="card">
        <h4>Account Number</h4>
        <p id="accountNumber">Loading...</p>
      </div>

      <div class="card">
        <h4>Account Type</h4>
        <p id="accountType">Loading...</p>
      </div>

      <div class="card">
        <h4>Balance</h4>
        <p id="balance">₹0.00</p>
      </div>

    </div>

    <div class="transactions">

      <h2>Recent Transactions</h2>

      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="transactionList">
        </tbody>
      </table>

    </div>

    <a href="transfer.html" class="transfer-btn">
      Transfer Money
    </a>

    <div id="message"></div>

  </div>


  <script>

    // ==========================================
    // SUPABASE SETTINGS
    // ==========================================

    const SUPABASE_URL =
      "https://ncihofyhnpxrftilejij.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_FDd8fKnlcN8RBqSqovQlIQ_-cx_tZwi";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // LOAD DASHBOARD
    // ==========================================

    async function loadDashboard() {

      document.getElementById("message").innerText = "";

      // Get logged-in user
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();


      if (userError || !user) {
        window.location.href = "index.html";
        return;
      }


      // ==========================================
      // CUSTOMER INFORMATION
      // ==========================================

      const {
        data: customer,
        error: customerError
      } = await supabaseClient
        .from("customers")
        .select("*")
        .eq("auth_user_id", user.id)
        .single();


      if (customerError || !customer) {

        console.error("Customer Error:", customerError);

        document.getElementById("message").innerText =
          "Customer information not found.";

        return;
      }


      // Customer name
      document.getElementById("customerName").innerText =
        customer.full_name || "Customer";


      // ==========================================
      // ACCOUNT INFORMATION
      // ==========================================

      const {
        data: accounts,
        error: accountError
      } = await supabaseClient
        .from("accounts")
        .select("*")
        .eq("customer_id", customer.id)
        .order("created_at", { ascending: false });


      if (accountError) {

        console.error("Account Error:", accountError);

        document.getElementById("message").innerText =
          "Unable to load account information.";

        return;
      }


      if (!accounts || accounts.length === 0) {

        document.getElementById("message").innerText =
          "Account information not found.";

        return;
      }


      // First account
      const account = accounts[0];


      // Account number
      document.getElementById("accountNumber").innerText =
        account.account_number || "-";


      // Account type
      document.getElementById("accountType").innerText =
        account.account_type || "-";


      // Balance
      document.getElementById("balance").innerText =
        "₹" + Number(account.balance || 0).toFixed(2);


      // ==========================================
      // TRANSACTIONS
      // ==========================================

      const {
        data: transactions,
        error: transactionError
      } = await supabaseClient
        .from("transactions")
        .select("*")
        .eq("account_id", account.id)
        .order("created_at", { ascending: false })
        .limit(10);


      const list =
        document.getElementById("transactionList");


      list.innerHTML = "";


      if (transactionError) {

        console.error(
          "Transaction Error:",
          transactionError
        );

        list.innerHTML =
          `<tr>
            <td colspan="4">
              Unable to load transactions
            </td>
          </tr>`;

        return;
      }


      if (!transactions || transactions.length === 0) {

        list.innerHTML =
          `<tr>
            <td colspan="4">
              No transactions found
            </td>
          </tr>`;

        return;
      }


      // Display transactions
      transactions.forEach(function(transaction) {

        const row =
          document.createElement("tr");


        const typeClass =
          transaction.transaction_type === "CREDIT"
            ? "credit"
            : "debit";


        row.innerHTML = `
          <td class="${typeClass}">
            ${transaction.transaction_type || "-"}
          </td>

          <td>
            ₹${Number(transaction.amount || 0).toFixed(2)}
          </td>

          <td>
            ${transaction.description || "-"}
          </td>

          <td>
            ${transaction.status || "-"}
          </td>
        `;


        list.appendChild(row);

      });

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async function() {

        const { error } =
          await supabaseClient.auth.signOut();


        if (error) {

          console.error("Logout Error:", error);

          return;
        }


        window.location.href = "index.html";

      });


    // ==========================================
    // START DASHBOARD
    // ==========================================

    loadDashboard();
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
  </script>

</body>
</html>
