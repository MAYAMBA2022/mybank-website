<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBank Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
    }

    .login-box {
      width: 360px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">MyBank</div>

    <div class="subtitle">
      Secure Banking Login
    </div>

    <form id="loginForm">

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      New Customer?
      <a href="register.html">Create Account</a>
    </div>

  </div>


  <script>

    // Supabase connection
    const SUPABASE_URL =
      "https://ncihofyhnpxrftilejij.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_FDd8fKnlcN8RBqSqovQlIQ_-cx_tZwi";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // Login
    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        message.style.color = "blue";
        message.innerText = "Logging in...";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.style.color = "red";

          message.innerText =
            "Login failed: " + error.message;

          return;
        }


        message.style.color = "green";

        message.innerText =
          "Login successful!";


        // Go to Dashboard
        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 500);

      });

  </script>

</body>
</html>
