<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyBank Staff Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      color: #0f172a;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header h2 {
      font-size: 24px;
    }

    .logout {
      padding: 10px 18px;
      background: white;
      color: #2563eb;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 15px;
      color: #1e293b;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      padding: 11px 17px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .orange {
      background: #ea580c;
      color: white;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
    }

    .account-result {
      margin-top: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      display: none;
    }

    .transactions {
      margin-top: 25px;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      min-width: 650px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    .credit {
      color: green;
      font-weight: bold;
    }

    .debit {
      color: red;
      font-weight: bold;
    }

    @media(max-width:600px) {
      .header {
        padding: 15px;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="header">

    <h2>MyBank - Staff</h2>

    <button
      class="logout"
      id="logoutBtn">
      Logout
    </button>

  </div>


  <div class="container">

    <!-- WELCOME -->

    <div class="welcome">

      <h2>
        Staff Banking Panel 👨‍💼
      </h2>

      <p>
        Customer accounts, cash transactions and banking operations
      </p>

    </div>


    <!-- MAIN GRID -->

    <div class="grid">


      <!-- CUSTOMER SEARCH -->

      <div class="card">

        <h3>🔎 Customer / Account Search</h3>

        <input
          type="text"
          id="searchAccount"
          placeholder="Enter Account Number">

        <button
          class="blue"
          onclick="searchAccount()">
          Search Account
        </button>

        <div
          id="accountResult"
          class="account-result">
        </div>

      </div>


      <!-- CASH DEPOSIT -->

      <div class="card">

        <h3>💰 Cash Deposit</h3>

        <input
          type="text"
          id="depositAccount"
          placeholder="Account Number">

        <input
          type="number"
          id="depositAmount"
          placeholder="Amount"
          min="1">

        <input
          type="text"
          id="depositDescription"
          placeholder="Description"
          value="Cash Deposit">

        <button
          class="green"
          onclick="depositMoney()">
          Deposit Money
        </button>

        <div
          id="depositMessage"
          class="message">
        </div>

      </div>


      <!-- CASH WITHDRAWAL -->

      <div class="card">

        <h3>💵 Cash Withdrawal</h3>

        <input
          type="text"
          id="withdrawAccount"
          placeholder="Account Number">

        <input
          type="number"
          id="withdrawAmount"
          placeholder="Amount"
          min="1">

        <input
          type="text"
          id="withdrawDescription"
          placeholder="Description"
          value="Cash Withdrawal">

        <button
          class="red"
          onclick="withdrawMoney()">
          Withdraw Money
        </button>

        <div
          id="withdrawMessage"
          class="message">
        </div>

      </div>


      <!-- ACCOUNT TYPE -->

      <div class="card">

        <h3>🏦 Account Type</h3>

        <select id="accountTypeSelect">

          <option value="SAVINGS">
            Savings Account
          </option>

          <option value="CURRENT">
            Current Account
          </option>

        </select>

        <input
          type="text"
          id="newAccountCustomer"
          placeholder="Customer ID">

        <input
          type="text"
          id="newAccountNumber"
          placeholder="Account Number">

        <button
          class="blue"
          onclick="createAccount()">
          Create Account
        </button>

        <div
          id="accountCreateMessage"
          class="message">
        </div>

      </div>


      <!-- MONEY TRANSFER -->

      <div class="card">

        <h3>🔄 Money Transfer</h3>

        <input
          type="text"
          id="transferFrom"
          placeholder="From Account Number">

        <input
          type="text"
          id="transferTo"
          placeholder="To Account Number">

        <input
          type="number"
          id="transferAmount"
          placeholder="Amount"
          min="1">

        <input
          type="text"
          id="transferDescription"
          placeholder="Description"
          value="Account Transfer">

        <button
          class="orange"
          onclick="transferMoney()">
          Transfer
        </button>

        <div
          id="transferMessage"
          class="message">
        </div>

      </div>


    </div>


    <!-- TRANSACTIONS -->

    <div class="transactions">

      <h2>🧾 Recent Transactions</h2>

      <table>

        <thead>

          <tr>

            <th>Account</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Reference</th>
            <th>Status</th>

          </tr>

        </thead>

        <tbody id="staffTransactionList">

        </tbody>

      </table>

    </div>


  </div>


  <script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://ncihofyhnpxrftilejij.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_FDd8fKnlcN8RBqSqovQlIQ_-cx_tZwi";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // SEARCH ACCOUNT
    // ==========================================

    async function searchAccount() {

      const accountNumber =
        document
          .getElementById("searchAccount")
          .value
          .trim();

      const result =
        document.getElementById("accountResult");

      result.style.display = "block";

      if (!accountNumber) {

        result.innerHTML =
          "Please enter account number.";

        return;
      }

      const { data: account, error } =
        await supabaseClient
          .from("accounts")
          .select("*")
          .eq("account_number", accountNumber)
          .single();

      if (error || !account) {

        result.innerHTML =
          "❌ Account not found.";

        return;
      }

      result.innerHTML = `
        <strong>Account Number:</strong>
        ${account.account_number}
        <br><br>

        <strong>Account Type:</strong>
        ${account.account_type}
        <br><br>

        <strong>Balance:</strong>
        ₹${Number(account.balance || 0).toFixed(2)}
      `;

    }


    // ==========================================
    // DEPOSIT MONEY
    // ==========================================

    async function depositMoney() {

      const accountNumber =
        document
          .getElementById("depositAccount")
          .value
          .trim();

      const amount =
        Number(
          document.getElementById("depositAmount").value
        );

      const description =
        document
          .getElementById("depositDescription")
          .value
          .trim() || "Cash Deposit";

      const message =
        document.getElementById("depositMessage");

      message.innerText = "";

      if (!accountNumber) {

        message.innerText =
          "Please enter account number.";

        message.style.color = "red";

        return;
      }

      if (!amount || amount <= 0) {

        message.innerText =
          "Please enter valid amount.";

        message.style.color = "red";

        return;
      }

      const { data: account, error: accountError } =
        await supabaseClient
          .from("accounts")
          .select("*")
          .eq("account_number", accountNumber)
          .single();

      if (accountError || !account) {

        message.innerText =
          "Account not found.";

        message.style.color = "red";

        return;
      }

      const newBalance =
        Number(account.balance || 0) + amount;

      const { error: updateError } =
        await supabaseClient
          .from("accounts")
          .update({
            balance: newBalance
          })
          .eq("id", account.id);

      if (updateError) {

        console.error(updateError);

        message.innerText =
          "Balance update failed.";

        message.style.color = "red";

        return;
      }

      const { error: transactionError } =
        await supabaseClient
          .from("transactions")
          .insert({

            account_id: account.id,

            transaction_type: "CREDIT",

            amount: amount,

            description: description,

            reference_number:
              "DEP-" + Date.now(),

            status: "SUCCESS"

          });

      if (transactionError) {

        console.error(transactionError);

        message.innerText =
          "Transaction save failed.";

        message.style.color = "red";

        return;
      }

      message.innerText =
        "✅ Deposit Successful | New Balance: ₹" +
        newBalance.toFixed(2);

      message.style.color = "green";

      document.getElementById(
        "depositAmount"
      ).value = "";

      loadStaffTransactions();

    }


    // ==========================================
    // WITHDRAW MONEY
    // ==========================================

    async function withdrawMoney() {

      const accountNumber =
        document
          .getElementById("withdrawAccount")
          .value
          .trim();

      const amount =
        Number(
          document.getElementById("withdrawAmount").value
        );

      const description =
        document
          .getElementById("withdrawDescription")
          .value
          .trim() || "Cash Withdrawal";

      const message =
        document.getElementById("withdrawMessage");

      message.innerText = "";

      if (!accountNumber) {

        message.innerText =
          "Please enter account number.";

        message.style.color = "red";

        return;
      }

      if (!amount || amount <= 0) {

        message.innerText =
          "Please enter valid amount.";

        message.style.color = "red";

        return;
      }

      const { data: account, error: accountError } =
        await supabaseClient
          .from("accounts")
          .select("*")
          .eq("account_number", accountNumber)
          .single();

      if (accountError || !account) {

        message.innerText =
          "Account not found.";

        message.style.color = "red";

        return;
      }

      const currentBalance =
        Number(account.balance || 0);

      if (currentBalance < amount) {

        message.innerText =
          "❌ Insufficient Balance. Available: ₹" +
          currentBalance.toFixed(2);

        message.style.color = "red";

        return;
      }

      const newBalance =
        currentBalance - amount;

      const { error: updateError } =
        await supabaseClient
          .from("accounts")
          .update({
            balance: newBalance
          })
          .eq("id", account.id);

      if (updateError) {

        console.error(updateError);

        message.innerText =
          "Balance update failed.";

        message.style.color = "red";

        return;
      }

      const { error: transactionError } =
        await supabaseClient
          .from("transactions")
          .insert({

            account_id: account.id,

            transaction_type: "DEBIT",

            amount: amount,

            description: description,

            reference_number:
              "WDL-" + Date.now(),

            status: "SUCCESS"

          });

      if (transactionError) {

        console.error(transactionError);

        message.innerText =
          "Transaction save failed.";

        message.style.color = "red";

        return;
      }

      message.innerText =
        "✅ Withdrawal Successful | Remaining Balance: ₹" +
        newBalance.toFixed(2);

      message.style.color = "green";

      document.getElementById(
        "withdrawAmount"
      ).value = "";

      loadStaffTransactions();

    }


    // ==========================================
    // CREATE ACCOUNT
    // ==========================================

    async function createAccount() {

      const customerId =
        document
          .getElementById("newAccountCustomer")
          .value
          .trim();

      const accountNumber =
        document
          .getElementById("newAccountNumber")
          .value
          .trim();

      const accountType =
        document
          .getElementById("accountTypeSelect")
          .value;

      const message =
        document.getElementById(
          "accountCreateMessage"
        );

      if (!customerId || !accountNumber) {

        message.innerText =
          "Customer ID and Account Number are required.";

        message.style.color = "red";

        return;
      }

      const { data, error } =
        await supabaseClient
          .from("accounts")
          .insert({

            customer_id: customerId,

            account_number: accountNumber,

            account_type: accountType,

            balance: 0

          })
          .select()
          .single();

      if (error) {

        console.error(error);

        message.innerText =
          "Account creation failed: " +
          error.message;

        message.style.color = "red";

        return;
      }

      message.innerText =
        "✅ Account created successfully.";

      message.style.color = "green";

      console.log("New Account:", data);

    }


    // ==========================================
    // TRANSFER MONEY
    // ==========================================

    async function transferMoney() {

      const fromAccount =
        document
          .getElementById("transferFrom")
          .value
          .trim();

      const toAccount =
        document
          .getElementById("transferTo")
          .value
          .trim();

      const amount =
        Number(
          document.getElementById("transferAmount").value
        );

      const description =
        document
          .getElementById("transferDescription")
          .value
          .trim() || "Account Transfer";

      const message =
        document.getElementById(
          "transferMessage"
        );

      message.innerText = "";

      if (!fromAccount || !toAccount) {

        message.innerText =
          "Both account numbers are required.";

        message.style.color = "red";

        return;
      }

      if (fromAccount === toAccount) {

        message.innerText =
          "Sender and receiver cannot be same.";

        message.style.color = "red";

        return;
      }

      if (!amount || amount <= 0) {

        message.innerText =
          "Please enter valid amount.";

        message.style.color = "red";

        return;
      }

      const { data: sender, error: senderError } =
        await supabaseClient
          .from("accounts")
          .select("*")
          .eq("account_number", fromAccount)
          .single();

      if (senderError || !sender) {

        message.innerText =
          "Sender account not found.";

        message.style.color = "red";

        return;
      }

      const senderBalance =
        Number(sender.balance || 0);

      if (senderBalance < amount) {

        message.innerText =
          "Insufficient sender balance.";

        message.style.color = "red";

        return;
      }

      const { data: receiver, error: receiverError } =
        await supabaseClient
          .from("accounts")
          .select("*")
          .eq("account_number", toAccount)
          .single();

      if (receiverError || !receiver) {

        message.innerText =
          "Receiver account not found.";

        message.style.color = "red";

        return;
      }

      const newSenderBalance =
        senderBalance - amount;

      const newReceiverBalance =
        Number(receiver.balance || 0) + amount;


      const { error: senderUpdateError } =
        await supabaseClient
          .from("accounts")
          .update({
            balance: newSenderBalance
          })
          .eq("id", sender.id);

      if (senderUpdateError) {

        console.error(senderUpdateError);

        message.innerText =
          "Sender balance update failed.";

        message.style.color = "red";

        return;
      }


      const { error: receiverUpdateError } =
        await supabaseClient
          .from("accounts")
          .update({
            balance: newReceiverBalance
          })
          .eq("id", receiver.id);

      if (receiverUpdateError) {

        console.error(receiverUpdateError);

        message.innerText =
          "Receiver balance update failed.";

        message.style.color = "red";

        return;
      }


      // Sender transaction

      await supabaseClient
        .from("transactions")
        .insert({

          account_id: sender.id,

          transaction_type: "DEBIT",

          amount: amount,

          description: description,

          reference_number:
            "TRF-" + Date.now(),

          status: "SUCCESS"

        });


      // Receiver transaction

      await supabaseClient
        .from("transactions")
        .insert({

          account_id: receiver.id,

          transaction_type: "CREDIT",

          amount: amount,

          description: description,

          reference_number:
            "TRF-" + Date.now(),

          status: "SUCCESS"

        });


      message.innerText =
        "✅ Transfer Successful.";

      message.style.color = "green";

      document.getElementById(
        "transferAmount"
      ).value = "";

      loadStaffTransactions();

    }


    // ==========================================
    // LOAD TRANSACTIONS
    // ==========================================

    async function loadStaffTransactions() {

      const { data, error } =
        await supabaseClient
          .from("transactions")
          .select(`
            *,
            accounts (
              account_number
            )
          `)
          .order("created_at", {
            ascending: false
          })
          .limit(20);

      const list =
        document.getElementById(
          "staffTransactionList"
        );

      if (!list) return;

      list.innerHTML = "";

      if (error) {

        console.error(error);

        list.innerHTML =
          `<tr>
            <td colspan="6">
              Unable to load transactions
            </td>
          </tr>`;

        return;
      }

      if (!data || data.length === 0) {

        list.innerHTML =
          `<tr>
            <td colspan="6">
              No transactions found
            </td>
          </tr>`;

        return;
      }

      data.forEach(transaction => {

        const row =
          document.createElement("tr");

        const type =
          transaction.transaction_type || "-";

        const typeClass =
          type === "CREDIT"
            ? "credit"
            : "debit";

        const accountNumber =
          transaction.accounts
            ? transaction.accounts.account_number
            : "-";

        row.innerHTML = `

          <td>${accountNumber}</td>

          <td class="${typeClass}">
            ${type}
          </td>

          <td>
            ₹${Number(transaction.amount || 0).toFixed(2)}
          </td>

          <td>
            ${transaction.description || "-"}
          </td>

          <td>
            ${transaction.reference_number || "-"}
          </td>

          <td>
            ${transaction.status || "-"}
          </td>

        `;

        list.appendChild(row);

      });

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          await supabaseClient.auth.signOut();

          window.location.href =
            "index.html";

        }
      );


    // ==========================================
    // START
    // ==========================================

    loadStaffTransactions();

  </script>

</body>
</html>
