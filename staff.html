<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MyBank - Staff Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    min-height: 100vh;
}

.header {
    background: #2563eb;
    color: white;
    padding: 18px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-size: 24px;
}

.logout {
    width: auto;
    padding: 10px 18px;
    background: white;
    color: #2563eb;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.welcome {
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));

    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.08);
}

.card h3 {
    margin-bottom: 18px;
    color: #1e293b;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;

    border: 1px solid #cbd5e1;
    border-radius: 7px;

    font-size: 15px;
}

button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 7px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.blue {
    background: #2563eb;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.red {
    background: #dc2626;
    color: white;
}

.orange {
    background: #ea580c;
    color: white;
}

.verify-btn {
    background: #475569;
    color: white;
    margin-bottom: 12px;
}

.verify-box {
    display: none;

    background: #f8fafc;

    border: 1px solid #cbd5e1;

    padding: 14px;

    border-radius: 8px;

    margin-bottom: 15px;

    line-height: 1.8;
}

.verify-success {
    border-left: 5px solid #16a34a;
}

.verify-error {
    border-left: 5px solid #dc2626;
    color: red;
}

.full {
    grid-column: 1 / -1;
}

.small {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 12px;
}

.success {
    color: green;
    font-weight: bold;
}

.error {
    color: red;
    font-weight: bold;
}

.result {
    margin-top: 15px;
    padding: 12px;

    background: #f8fafc;

    border-radius: 7px;

    line-height: 1.7;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 12px;

    border-bottom:
        1px solid #e2e8f0;

    text-align: left;
}

th {
    background: #f8fafc;
}

.credit {
    color: green;
    font-weight: bold;
}

.debit {
    color: red;
    font-weight: bold;
}

@media(max-width:600px) {

    .header {
        padding: 15px;
    }

    .header h2 {
        font-size: 18px;
    }

    .container {
        padding: 10px;
        margin: 15px auto;
    }

    .card {
        padding: 18px;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h2>MyBank - Staff Panel</h2>

    <button
        class="logout"
        id="logoutBtn">

        Logout

    </button>

</div>


<div class="container">


<div class="welcome">

    <h2>Banking Operations</h2>

    <p class="small">
        Customer Management • Deposit • Withdrawal • Transfer
    </p>

</div>


<div class="grid">


<!-- =====================================================
     CREATE CUSTOMER
===================================================== -->

<div class="card">

    <h3>👤 Create Customer & Account</h3>

    <input
        type="text"
        id="newCustomerName"
        placeholder="Customer Full Name">

    <input
        type="text"
        id="newCustomerAddress"
        placeholder="Address">

    <input
        type="text"
        id="newCustomerAadhaar"
        placeholder="Aadhaar Number"
        maxlength="12"
        inputmode="numeric">

    <input
        type="text"
        id="newCustomerPan"
        placeholder="PAN Number"
        maxlength="10"
        style="text-transform:uppercase">

    <input
        type="text"
        id="newCustomerMobile"
        placeholder="Mobile Number"
        maxlength="10"
        inputmode="numeric">

    <input
        type="email"
        id="newCustomerEmail"
        placeholder="Email">

    <input
        type="file"
        id="newCustomerPhoto"
        accept="image/*">

    <select id="accountTypeSelect">

        <option value="SAVINGS">
            Savings Account
        </option>

        <option value="CURRENT">
            Current Account
        </option>

    </select>

    <button
        class="blue"
        onclick="createCustomerAndAccount()">

        Create Customer & Account

    </button>

    <div
        id="accountCreateMessage"
        class="result">

    </div>

</div>


<!-- =====================================================
     DEPOSIT
===================================================== -->

<div class="card">

    <h3>💰 Cash Deposit</h3>

    <input
        type="text"
        id="depositAccount"
        placeholder="Enter Account Number"
        oninput="clearDepositVerification()">

    <button
        class="verify-btn"
        onclick="verifyDepositAccount()">

        🔍 Verify Account

    </button>

    <div
        id="depositVerifyBox"
        class="verify-box">

    </div>

    <input
        type="number"
        id="depositAmount"
        placeholder="Enter Deposit Amount"
        min="1">

    <input
        type="text"
        id="depositDescription"
        placeholder="Description">

    <button
        class="green"
        id="depositBtn"
        onclick="depositMoney()">

        Deposit Money

    </button>

</div>


<!-- =====================================================
     WITHDRAWAL
===================================================== -->

<div class="card">

    <h3>💵 Cash Withdrawal</h3>

    <input
        type="text"
        id="withdrawAccount"
        placeholder="Enter Account Number"
        oninput="clearWithdrawVerification()">

    <button
        class="verify-btn"
        onclick="verifyWithdrawAccount()">

        🔍 Verify Account

    </button>

    <div
        id="withdrawVerifyBox"
        class="verify-box">

    </div>

    <input
        type="number"
        id="withdrawAmount"
        placeholder="Enter Withdrawal Amount"
        min="1">

    <input
        type="text"
        id="withdrawDescription"
        placeholder="Description">

    <button
        class="red"
        id="withdrawBtn"
        onclick="withdrawMoney()">

        Withdraw Money

    </button>

</div>


<!-- =====================================================
     TRANSFER
===================================================== -->

<div class="card">

    <h3>🔄 Money Transfer</h3>

    <input
        type="text"
        id="fromAccount"
        placeholder="From Account Number"
        oninput="clearTransferVerification()">

    <button
        class="verify-btn"
        onclick="verifyTransferAccounts()">

        🔍 Verify Both Accounts

    </button>

    <div
        id="fromVerifyBox"
        class="verify-box">

    </div>

    <input
        type="text"
        id="toAccount"
        placeholder="To Account Number"
        oninput="clearTransferVerification()">

    <div
        id="toVerifyBox"
        class="verify-box">

    </div>

    <input
        type="number"
        id="transferAmount"
        placeholder="Transfer Amount"
        min="1">

    <input
        type="text"
        id="transferDescription"
        placeholder="Description">

    <button
        class="orange"
        id="transferBtn"
        onclick="transferMoney()">

        Transfer Money

    </button>

</div>


<!-- =====================================================
     RECENT TRANSACTIONS
===================================================== -->

<div class="card full">

    <h3>📋 Recent Transactions</h3>

    <table>

        <thead>

            <tr>

                <th>Account</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Status</th>
                <th>Date</th>

            </tr>

        </thead>

        <tbody id="transactionList">

            <tr>

                <td colspan="6">
                    Loading...
                </td>

            </tr>

        </tbody>

    </table>

</div>


</div>

</div>


<script>


// =====================================================
// SUPABASE CONFIGURATION
// =====================================================

const SUPABASE_URL =
"https://ncihofyhnpxrftilejij.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_FDd8fKnlcN8RBqSqovQlIQ_-cx_tZwi";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// =====================================================
// CUSTOMER CREATE
// =====================================================

async function createCustomerAndAccount() {

    const name =
        document.getElementById("newCustomerName")
        .value.trim();

    const address =
        document.getElementById("newCustomerAddress")
        .value.trim();

    const aadhaar =
        document.getElementById("newCustomerAadhaar")
        .value.trim();

    const pan =
        document.getElementById("newCustomerPan")
        .value.trim()
        .toUpperCase();

    const mobile =
        document.getElementById("newCustomerMobile")
        .value.trim();

    const email =
        document.getElementById("newCustomerEmail")
        .value.trim();

    const accountType =
        document.getElementById("accountTypeSelect")
        .value;

    const message =
        document.getElementById("accountCreateMessage");


    if (!name) {

        message.innerHTML =
        "❌ Customer name required.";

        message.className =
        "result error";

        return;
    }


    if (!address) {

        message.innerHTML =
        "❌ Address required.";

        message.className =
        "result error";

        return;
    }


    if (!/^\d{12}$/.test(aadhaar)) {

        message.innerHTML =
        "❌ Aadhaar must contain 12 digits.";

        message.className =
        "result error";

        return;
    }


    if (!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan)) {

        message.innerHTML =
        "❌ Invalid PAN number.";

        message.className =
        "result error";

        return;
    }


    if (
        mobile &&
        !/^\d{10}$/.test(mobile)
    ) {

        message.innerHTML =
        "❌ Mobile must contain 10 digits.";

        message.className =
        "result error";

        return;
    }


    message.innerHTML =
    "Creating Customer...";

    message.className =
    "result";


    try {

        const {
            data: customer,
            error: customerError
        } =
        await supabaseClient
        .from("customers")
        .insert({

            full_name: name,
            address: address,
            aadhaar_number: aadhaar,
            pan_number: pan,
            mobile: mobile || null,
            email: email || null

        })
        .select(
            "id, customer_number, full_name"
        )
        .single();


        if (customerError) {

            message.innerHTML =
            "❌ Customer creation failed:<br>" +
            customerError.message;

            message.className =
            "result error";

            return;
        }


        const {
            data: account,
            error: accountError
        } =
        await supabaseClient
        .from("accounts")
        .insert({

            customer_id:
                customer.id,

            account_type:
                accountType,

            balance: 0

        })
        .select(
            "account_number, account_type, balance"
        )
        .single();


        if (accountError) {

            message.innerHTML =
            "❌ Account creation failed:<br>" +
            accountError.message;

            message.className =
            "result error";

            return;
        }


        message.innerHTML =

        "✅ Customer Created Successfully!<br><br>" +

        "Customer ID: <strong>" +
        customer.customer_number +
        "</strong><br>" +

        "Account Number: <strong>" +
        account.account_number +
        "</strong><br>" +

        "Account Type: <strong>" +
        account.account_type +
        "</strong><br>" +

        "Opening Balance: <strong>₹0.00</strong>";


        message.className =
        "result success";


        document.getElementById("newCustomerName").value = "";
        document.getElementById("newCustomerAddress").value = "";
        document.getElementById("newCustomerAadhaar").value = "";
        document.getElementById("newCustomerPan").value = "";
        document.getElementById("newCustomerMobile").value = "";
        document.getElementById("newCustomerEmail").value = "";
        document.getElementById("newCustomerPhoto").value = "";

    }

    catch (error) {

        console.error(error);

        message.innerHTML =
        "❌ Error: " + error.message;

        message.className =
        "result error";

    }

}


// =====================================================
// DEPOSIT VERIFICATION
// =====================================================

let verifiedDepositAccount = null;


async function verifyDepositAccount() {

    const accountNumber =
        document.getElementById("depositAccount")
        .value.trim();

    const box =
        document.getElementById("depositVerifyBox");


    verifiedDepositAccount = null;

    box.style.display = "block";


    if (!accountNumber) {

        box.innerHTML =
        "❌ Please enter Account Number.";

        box.className =
        "verify-box verify-error";

        return;
    }


    const {
        data: account,
        error
    } =
    await supabaseClient
    .from("accounts")
    .select(`
        id,
        account_number,
        account_type,
        balance,
        customers (
            customer_number,
            full_name,
            mobile
        )
    `)
    .eq(
        "account_number",
        accountNumber
    )
    .single();


    if (error || !account) {

        box.innerHTML =
        "❌ Account Not Found.";

        box.className =
        "verify-box verify-error";

        return;
    }


    verifiedDepositAccount =
        account;


    box.innerHTML =

    "✅ <strong>ACCOUNT VERIFIED</strong><br>" +

    "Customer Name: <strong>" +
    (account.customers?.full_name || "-") +
    "</strong><br>" +

    "Customer ID: <strong>" +
    (account.customers?.customer_number || "-") +
    "</strong><br>" +

    "Account Number: <strong>" +
    account.account_number +
    "</strong><br>" +

    "Account Type: <strong>" +
    account.account_type +
    "</strong><br>" +

    "Current Balance: <strong>₹" +
    Number(account.balance || 0).toFixed(2) +
    "</strong>";


    box.className =
    "verify-box verify-success";

}


// =====================================================
// CLEAR DEPOSIT
// =====================================================

function clearDepositVerification() {

    verifiedDepositAccount = null;

    document.getElementById(
        "depositVerifyBox"
    ).style.display = "none";

}


// =====================================================
// DEPOSIT MONEY
// =====================================================

async function depositMoney() {

    if (!verifiedDepositAccount) {

        alert(
            "Please verify the Account Number first."
        );

        return;
    }


    const accountNumber =
        document.getElementById("depositAccount")
        .value.trim();

    const amount =
        Number(
            document.getElementById("depositAmount")
            .value
        );

    const description =
        document.getElementById("depositDescription")
        .value.trim()
        || "Cash Deposit";


    if (
        accountNumber !==
        verifiedDepositAccount.account_number
    ) {

        alert(
            "Account changed. Please verify again."
        );

        return;
    }


    if (!amount || amount <= 0) {

        alert(
            "Please enter valid amount."
        );

        return;
    }


    const currentBalance =
        Number(
            verifiedDepositAccount.balance || 0
        );

    const newBalance =
        currentBalance + amount;


    const {
        error: updateError
    } =
    await supabaseClient
    .from("accounts")
    .update({

        balance: newBalance

    })
    .eq(
        "id",
        verifiedDepositAccount.id
    );


    if (updateError) {

        alert(
            "Deposit failed: " +
            updateError.message
        );

        return;
    }


    // UNIQUE REFERENCE
    const reference =
        "DEP-" + crypto.randomUUID();


    const {
        error: transactionError
    } =
    await supabaseClient
    .from("transactions")
    .insert({

        account_id:
            verifiedDepositAccount.id,

        transaction_type:
            "CREDIT",

        amount:
            amount,

        description:
            description,

        reference_number:
            reference,

        status:
            "SUCCESS"

    });


    if (transactionError) {

        alert(
            "Transaction save failed: " +
            transactionError.message
        );

        return;
    }


    alert(
        "Deposit Successful!\n\n" +

        "Customer: " +
        (verifiedDepositAccount.customers?.full_name || "-") +

        "\nAccount: " +
        accountNumber +

        "\nPrevious Balance: ₹" +
        currentBalance.toFixed(2) +

        "\nDeposit: ₹" +
        amount.toFixed(2) +

        "\nNew Balance: ₹" +
        newBalance.toFixed(2)
    );


    document.getElementById("depositAccount").value = "";
    document.getElementById("depositAmount").value = "";
    document.getElementById("depositDescription").value = "";

    clearDepositVerification();

    loadTransactions();

}


// =====================================================
// WITHDRAW VERIFICATION
// =====================================================

let verifiedWithdrawAccount = null;


async function verifyWithdrawAccount() {

    const accountNumber =
        document.getElementById("withdrawAccount")
        .value.trim();

    const box =
        document.getElementById("withdrawVerifyBox");


    verifiedWithdrawAccount = null;

    box.style.display = "block";


    if (!accountNumber) {

        box.innerHTML =
        "❌ Please enter Account Number.";

        box.className =
        "verify-box verify-error";

        return;
    }


    const {
        data: account,
        error
    } =
    await supabaseClient
    .from("accounts")
    .select(`
        id,
        account_number,
        account_type,
        balance,
        customers (
            customer_number,
            full_name,
            mobile
        )
    `)
    .eq(
        "account_number",
        accountNumber
    )
    .single();


    if (error || !account) {

        box.innerHTML =
        "❌ Account Not Found.";

        box.className =
        "verify-box verify-error";

        return;
    }


    verifiedWithdrawAccount =
    account;


    box.innerHTML =

    "✅ <strong>ACCOUNT VERIFIED</strong><br>" +

    "Customer Name: <strong>" +
    (account.customers?.full_name || "-") +
    "</strong><br>" +

    "Customer ID: <strong>" +
    (account.customers?.customer_number || "-") +
    "</strong><br>" +

    "Account Number: <strong>" +
    account.account_number +
    "</strong><br>" +

    "Account Type: <strong>" +
    account.account_type +
    "</strong><br>" +

    "Current Balance: <strong>₹" +
    Number(account.balance || 0).toFixed(2) +
    "</strong>";


    box.className =
    "verify-box verify-success";

}


// =====================================================
// CLEAR WITHDRAW
// =====================================================

function clearWithdrawVerification() {

    verifiedWithdrawAccount = null;

    document.getElementById(
        "withdrawVerifyBox"
    ).style.display = "none";

}


// =====================================================
// WITHDRAW MONEY
// =====================================================

async function withdrawMoney() {

    if (!verifiedWithdrawAccount) {

        alert(
            "Please verify the Account Number first."
        );

        return;
    }


    const accountNumber =
        document.getElementById("withdrawAccount")
        .value.trim();

    const amount =
        Number(
            document.getElementById("withdrawAmount")
            .value
        );

    const description =
        document.getElementById("withdrawDescription")
        .value.trim()
        || "Cash Withdrawal";


    if (
        accountNumber !==
        verifiedWithdrawAccount.account_number
    ) {

        alert(
            "Account changed. Please verify again."
        );

        return;
    }


    if (!amount || amount <= 0) {

        alert(
            "Please enter valid amount."
        );

        return;
    }


    const currentBalance =
        Number(
            verifiedWithdrawAccount.balance || 0
        );


    if (currentBalance < amount) {

        alert(
            "Insufficient Balance!\n\n" +

            "Customer: " +
            (verifiedWithdrawAccount.customers?.full_name || "-") +

            "\nAvailable Balance: ₹" +
            currentBalance.toFixed(2)
        );

        return;
    }


    const newBalance =
        currentBalance - amount;


    const {
        error: updateError
    } =
    await supabaseClient
    .from("accounts")
    .update({

        balance: newBalance

    })
    .eq(
        "id",
        verifiedWithdrawAccount.id
    );


    if (updateError) {

        alert(
            "Withdrawal failed: " +
            updateError.message
        );

        return;
    }


    // UNIQUE REFERENCE
    const reference =
        "WDL-" + crypto.randomUUID();


    const {
        error: transactionError
    } =
    await supabaseClient
    .from("transactions")
    .insert({

        account_id:
            verifiedWithdrawAccount.id,

        transaction_type:
            "DEBIT",

        amount:
            amount,

        description:
            description,

        reference_number:
            reference,

        status:
            "SUCCESS"

    });


    if (transactionError) {

        alert(
            "Transaction save failed: " +
            transactionError.message
        );

        return;
    }


    alert(
        "Withdrawal Successful!\n\n" +

        "Customer: " +
        (verifiedWithdrawAccount.customers?.full_name || "-") +

        "\nAccount: " +
        accountNumber +

        "\nPrevious Balance: ₹" +
        currentBalance.toFixed(2) +

        "\nWithdrawal: ₹" +
        amount.toFixed(2) +

        "\nRemaining Balance: ₹" +
        newBalance.toFixed(2)
    );


    document.getElementById("withdrawAccount").value = "";
    document.getElementById("withdrawAmount").value = "";
    document.getElementById("withdrawDescription").value = "";

    clearWithdrawVerification();

    loadTransactions();

}


// =====================================================
// TRANSFER VERIFICATION
// =====================================================

let verifiedFromAccount = null;
let verifiedToAccount = null;


async function verifyTransferAccounts() {

    const fromAccount =
        document.getElementById("fromAccount")
        .value.trim();

    const toAccount =
        document.getElementById("toAccount")
        .value.trim();

    const fromBox =
        document.getElementById("fromVerifyBox");

    const toBox =
        document.getElementById("toVerifyBox");


    verifiedFromAccount = null;
    verifiedToAccount = null;


    fromBox.style.display = "block";
    toBox.style.display = "block";


    if (!fromAccount) {

        fromBox.innerHTML =
        "❌ Enter From Account Number.";

        fromBox.className =
        "verify-box verify-error";

    }


    if (!toAccount) {

        toBox.innerHTML =
        "❌ Enter To Account Number.";

        toBox.className =
        "verify-box verify-error";

    }


    if (!fromAccount || !toAccount) {
        return;
    }


    // FROM ACCOUNT

    const {
        data: sender,
        error: senderError
    } =
    await supabaseClient
    .from("accounts")
    .select(`
        id,
        account_number,
        account_type,
        balance,
        customers (
            customer_number,
            full_name,
            mobile
        )
    `)
    .eq(
        "account_number",
        fromAccount
    )
    .single();


    if (senderError || !sender) {

        fromBox.innerHTML =
        "❌ From Account Not Found.";

        fromBox.className =
        "verify-box verify-error";

    }
    else {

        verifiedFromAccount =
            sender;


        fromBox.innerHTML =

        "✅ <strong>FROM ACCOUNT VERIFIED</strong><br>" +

        "Customer Name: <strong>" +
        (sender.customers?.full_name || "-") +
        "</strong><br>" +

        "Customer ID: <strong>" +
        (sender.customers?.customer_number || "-") +
        "</strong><br>" +

        "Account Number: <strong>" +
        sender.account_number +
        "</strong><br>" +

        "Account Type: <strong>" +
        sender.account_type +
        "</strong><br>" +

        "Current Balance: <strong>₹" +
        Number(sender.balance || 0).toFixed(2) +
        "</strong>";

        fromBox.className =
        "verify-box verify-success";

    }


    // TO ACCOUNT

    const {
        data: receiver,
        error: receiverError
    } =
    await supabaseClient
    .from("accounts")
    .select(`
        id,
        account_number,
        account_type,
        balance,
        customers (
            customer_number,
            full_name,
            mobile
        )
    `)
    .eq(
        "account_number",
        toAccount
    )
    .single();


    if (
        receiverError ||
        !receiver
    ) {

        toBox.innerHTML =
        "❌ To Account Not Found.";

        toBox.className =
        "verify-box verify-error";

    }
    else {

        verifiedToAccount =
            receiver;


        toBox.innerHTML =

        "✅ <strong>TO ACCOUNT VERIFIED</strong><br>" +

        "Customer Name: <strong>" +
        (receiver.customers?.full_name || "-") +
        "</strong><br>" +

        "Customer ID: <strong>" +
        (receiver.customers?.customer_number || "-") +
        "</strong><br>" +

        "Account Number: <strong>" +
        receiver.account_number +
        "</strong><br>" +

        "Account Type: <strong>" +
        receiver.account_type +
        "</strong><br>" +

        "Current Balance: <strong>₹" +
        Number(receiver.balance || 0).toFixed(2) +
        "</strong>";

        toBox.className =
        "verify-box verify-success";

    }

}


// =====================================================
// CLEAR TRANSFER VERIFICATION
// =====================================================

function clearTransferVerification() {

    verifiedFromAccount = null;
    verifiedToAccount = null;

    document.getElementById(
        "fromVerifyBox"
    ).style.display = "none";

    document.getElementById(
        "toVerifyBox"
    ).style.display = "none";

}


// =====================================================
// TRANSFER MONEY
// =====================================================

async function transferMoney() {

    if (
        !verifiedFromAccount ||
        !verifiedToAccount
    ) {

        alert(
            "Please verify both accounts first."
        );

        return;
    }


    const fromAccount =
        document.getElementById("fromAccount")
        .value.trim();

    const toAccount =
        document.getElementById("toAccount")
        .value.trim();

    const amount =
        Number(
            document.getElementById("transferAmount")
            .value
        );

    const description =
        document.getElementById("transferDescription")
        .value.trim()
        || "Money Transfer";


    if (
        fromAccount !==
        verifiedFromAccount.account_number
    ) {

        alert(
            "From Account changed. Please verify again."
        );

        return;
    }


    if (
        toAccount !==
        verifiedToAccount.account_number
    ) {

        alert(
            "To Account changed. Please verify again."
        );

        return;
    }


    if (
        fromAccount ===
        toAccount
    ) {

        alert(
            "From and To Account cannot be same."
        );

        return;
    }


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "Please enter valid transfer amount."
        );

        return;
    }


    const senderBalance =
        Number(
            verifiedFromAccount.balance || 0
        );

    const receiverBalance =
        Number(
            verifiedToAccount.balance || 0
        );


    if (senderBalance < amount) {

        alert(
            "Insufficient Balance!\n\n" +

            "Customer: " +
            (
                verifiedFromAccount.customers
                ?.full_name || "-"
            ) +

            "\nAvailable Balance: ₹" +
            senderBalance.toFixed(2)
        );

        return;
    }


    const newSenderBalance =
        senderBalance - amount;

    const newReceiverBalance =
        receiverBalance + amount;


    // =================================================
    // UNIQUE TRANSFER REFERENCES
    // =================================================

    const transferId =
        crypto.randomUUID();

    const debitReference =
        "TRF-" +
        transferId +
        "-D";

    const creditReference =
        "TRF-" +
        transferId +
        "-C";


    // =================================================
    // UPDATE SENDER
    // =================================================

    const {
        error: senderUpdateError
    } =
    await supabaseClient
    .from("accounts")
    .update({

        balance:
            newSenderBalance

    })
    .eq(
        "id",
        verifiedFromAccount.id
    );


    if (senderUpdateError) {

        alert(
            "Sender balance update failed: " +
            senderUpdateError.message
        );

        return;
    }


    // =================================================
    // UPDATE RECEIVER
    // =================================================

    const {
        error: receiverUpdateError
    } =
    await supabaseClient
    .from("accounts")
    .update({

        balance:
            newReceiverBalance

    })
    .eq(
        "id",
        verifiedToAccount.id
    );


    if (receiverUpdateError) {

        alert(
            "Receiver balance update failed: " +
            receiverUpdateError.message
        );

        return;
    }


    // =================================================
    // DEBIT TRANSACTION
    // =================================================

    const {
        error: debitError
    } =
    await supabaseClient
    .from("transactions")
    .insert({

        account_id:
            verifiedFromAccount.id,

        transaction_type:
            "DEBIT",

        amount:
            amount,

        description:
            description,

        reference_number:
            debitReference,

        status:
            "SUCCESS"

    });


    if (debitError) {

        alert(
            "Debit transaction failed: " +
            debitError.message
        );

        return;
    }


    // =================================================
    // CREDIT TRANSACTION
    // =================================================

    const {
        error: creditError
    } =
    await supabaseClient
    .from("transactions")
    .insert({

        account_id:
            verifiedToAccount.id,

        transaction_type:
            "CREDIT",

        amount:
            amount,

        description:
            description,

        reference_number:
            creditReference,

        status:
            "SUCCESS"

    });


    if (creditError) {

        alert(
            "Credit transaction failed: " +
            creditError.message
        );

        return;
    }


    // =================================================
    // SUCCESS
    // =================================================

    alert(

        "Transfer Successful!\n\n" +

        "From Customer: " +
        (
            verifiedFromAccount.customers
            ?.full_name || "-"
        ) +

        "\nFrom Account: " +
        fromAccount +

        "\n\nTo Customer: " +
        (
            verifiedToAccount.customers
            ?.full_name || "-"
        ) +

        "\nTo Account: " +
        toAccount +

        "\n\nAmount: ₹" +
        amount.toFixed(2) +

        "\n\nSender New Balance: ₹" +
        newSenderBalance.toFixed(2)

    );


    document.getElementById("fromAccount").value = "";
    document.getElementById("toAccount").value = "";
    document.getElementById("transferAmount").value = "";
    document.getElementById("transferDescription").value = "";

    clearTransferVerification();

    loadTransactions();

}


// =====================================================
// LOAD TRANSACTIONS
// =====================================================

async function loadTransactions() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("transactions")
    .select(`
        *,
        accounts (
            account_number
        )
    `)
    .order(
        "created_at",
        {
            ascending: false
        }
    )
    .limit(30);


    const list =
        document.getElementById(
            "transactionList"
        );


    if (!list) return;


    list.innerHTML = "";


    if (error) {

        console.error(error);

        list.innerHTML =
        `<tr>
            <td colspan="6">
                Unable to load transactions
            </td>
        </tr>`;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
        `<tr>
            <td colspan="6">
                No transactions found
            </td>
        </tr>`;

        return;
    }


    data.forEach(
        function(transaction) {

            const row =
                document.createElement("tr");


            const type =
                transaction.transaction_type ||
                transaction.type ||
                "-";


            const typeClass =
                type === "CREDIT"
                ? "credit"
                : "debit";


            const accountNumber =
                transaction.accounts
                ?.account_number || "-";


            row.innerHTML = `

                <td>
                    ${accountNumber}
                </td>

                <td class="${typeClass}">
                    ${type}
                </td>

                <td>
                    ₹${Number(
                        transaction.amount || 0
                    ).toFixed(2)}
                </td>

                <td>
                    ${transaction.description || "-"}
                </td>

                <td>
                    ${transaction.status || "-"}
                </td>

                <td>
                    ${
                        transaction.created_at
                        ?
                        new Date(
                            transaction.created_at
                        ).toLocaleString()
                        :
                        "-"
                    }
                </td>

            `;


            list.appendChild(row);

        }
    );

}
