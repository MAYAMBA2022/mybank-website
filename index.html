<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBank</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
    }

    .box {
      width: 380px;
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      margin-bottom: 30px;
    }

    a {
      display: block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    a.register {
      background: #16a34a;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>MyBank</h1>

    <p>Welcome to MyBank Online Banking</p>

    <a href="login.html">
      Login
    </a>

    <a href="register.html" class="register">
      Create New Account
    </a>

  </div>

</body>
</html>
