<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyBank Register</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
    }

    .register-box {
      width: 400px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <h1>MyBank</h1>

    <div class="subtitle">
      Create Your Account
    </div>

    <form id="registerForm">

      <label>Full Name</label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter full name"
        required
      >

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter email"
        required
      >

      <label>Mobile</label>

      <input
        type="tel"
        id="mobile"
        placeholder="Enter mobile number"
        required
      >

      <label>Address</label>

      <input
        type="text"
        id="address"
        placeholder="Enter address"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create password"
        required
      >

      <button type="submit">
        Register
      </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://ncihofyhnpxrftilejij.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_FDd8fKnlcN8RBqSqovQlIQ_-cx_tZwi";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const fullName =
          document.getElementById("fullName").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const mobile =
          document.getElementById("mobile").value.trim();

        const address =
          document.getElementById("address").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        message.style.color = "blue";
        message.innerText = "Creating account...";


        // Create Supabase Auth user
        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        if (error) {

          message.style.color = "red";
          message.innerText =
            "Registration failed: " + error.message;

          return;
        }


        // Add customer information
        if (data.user) {

          const { error: customerError } =
            await supabaseClient
              .from("customers")
              .insert({
                id: data.user.id,
                full_name: fullName,
                email: email,
                mobile: mobile,
                address: address
              });


          if (customerError) {

            message.style.color = "red";

            message.innerText =
              "Account created, but customer data failed: " +
              customerError.message;

            return;
          }
        }


        message.style.color = "green";

        message.innerText =
          "Registration successful! Please login.";


        setTimeout(function() {

          window.location.href = "login.html";

        }, 1500);

      });

  </script>

</body>
</html>
